<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cuckoo Clock</title>
<meta name="theme-color" content="#8a5a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuckoo Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
  /* Layout: a cuckoo-clock house fills the stage (hand clock or digital clock inside); the answers sit below it, or beside it on wide screens. */
  :root{
    --wall:#fdf1d6; --wall-dot:#f6dfae; --wood:#8a5a2c; --wood-dark:#5b3418; --wood-light:#b97a40; --ink:#2a2140;
    --hour:#e8434a; --minute:#2b7de9; --hour-lit:#ff8a8e; --minute-lit:#7cc0ff; --lcd:#1d2433;
    --go:#43b05c; --gold:#ffc21a; --cream:#fffaf0;
    --title:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --read:Verdana,Tahoma,sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--title);
    background:var(--wall) radial-gradient(circle at 12px 12px, var(--wall-dot) 5px, transparent 6px) 0 0/48px 48px;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  /* ---------- corner buttons: home (top-left) and sound (top-right) ---------- */
  #home,#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home{left:calc(10px + env(safe-area-inset-left,0px))}
  #mute{right:calc(10px + env(safe-area-inset-right,0px))}
  #home svg,#mute svg{width:24px;height:24px}
  #home:active,#mute:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #mute .off{display:none} #mute.muted .on{display:none} #mute.muted .off{display:inline}

  /* ---------- menu: pick a level ---------- */
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.5vh,22px);
    padding:calc(60px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
  #menu h1{margin:0;font-size:clamp(36px,9vmin,72px);line-height:1;color:var(--wood-dark);text-shadow:0 4px 0 #f3c97a;letter-spacing:.02em;text-align:center}
  #menu .art{width:clamp(110px,26vmin,220px);height:auto;flex:0 1 auto;min-height:0}
  #levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.4vmin,18px);width:min(100%,520px)}
  .lvl{background:var(--cream);border:5px solid var(--wood);border-radius:22px;box-shadow:0 6px 0 var(--wood-dark);
    padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .lvl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--wood-dark)}
  .lvl svg{width:clamp(64px,17vmin,120px);height:auto}
  .lvl .digi{font-size:clamp(18px,4.4vmin,30px);padding:.1em .5em;border-radius:10px}
  .lvl .stars{font-family:var(--read);font-weight:bold;font-size:clamp(13px,3vmin,18px);color:#b8860b;min-height:1.2em}
  @media (min-aspect-ratio: 6/5){
    #menu{flex-direction:row;flex-wrap:wrap;align-content:center}
    #menu h1{width:100%}
    #levels{grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,820px)}
    #menu .art{display:none}
  }

  /* ---------- digital clock face (hour digits in the hour-hand colour, minutes in the minute-hand colour) ---------- */
  .digi{display:inline-flex;align-items:center;justify-content:center;background:var(--lcd);font-family:var(--read);font-weight:bold;
    border-radius:16px;line-height:1.15;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .digi .hh{color:var(--hour-lit)} .digi .mm{color:var(--minute-lit)} .digi .cc{color:#e8e8f0;margin:0 .04em}

  /* ---------- play screen ---------- */
  #play{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) auto;gap:6px;
    padding:calc(10px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}
  #bar{display:flex;align-items:center;justify-content:center;gap:clamp(3px,1.2vw,8px);padding:0 52px}
  #bar .dot{width:clamp(18px,5.4vw,30px);height:clamp(18px,5.4vw,30px);border-radius:50%;background:rgba(138,90,44,.18);
    display:grid;place-items:center;font-size:clamp(13px,4vw,22px);line-height:1;color:var(--gold);transition:transform .2s}
  #bar .dot.now{box-shadow:inset 0 0 0 3px var(--wood)}
  #bar .dot.gold,#bar .dot.helped{background:none;animation:dotPop .4s;font-size:clamp(22px,7vw,36px)}
  #bar .dot.gold::before{content:'★';text-shadow:0 2px 0 #c58e00}
  #bar .dot.helped::before{content:'★';color:#f2d98a}
  @keyframes dotPop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
  #stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
  #house{width:100%;height:100%;max-width:560px;overflow:visible;touch-action:none}
  #house.can-set{cursor:grab}
  #again{position:absolute;right:0;top:0;width:60px;height:60px;border-radius:50%;background:var(--gold);border:4px solid var(--wood);
    box-shadow:0 4px 0 var(--wood-dark);display:grid;place-items:center}
  #again svg{width:32px;height:32px}
  #again:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
  #panel{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,16px);min-height:0}
  @media (min-aspect-ratio: 6/5){
    #play{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
    #bar{grid-column:1/-1}
    #panel{flex-direction:column}
  }

  /* answer buttons */
  .choice{position:relative;border:5px solid var(--wood);box-shadow:0 6px 0 var(--wood-dark);transition:opacity .25s}
  .choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--wood-dark)}
  .choice.digi{width:min(30vw,210px);font-size:min(8.6vw,54px);padding:.32em 0}
  .choice.ana{width:min(29vw,23vh,200px);aspect-ratio:1;border-radius:50%;background:var(--wood);padding:4px}
  .choice.ana svg{width:100%;height:100%;display:block}
  .choice.wrong{opacity:.28;animation:shake .4s;pointer-events:none}
  .choice.hint{animation:glow 1s ease-in-out infinite}
  .choice.right{border-color:var(--go);box-shadow:0 6px 0 #2c7a3d,0 0 0 6px rgba(67,176,92,.35)}
  @keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:8px}60%{translate:-6px}80%{translate:4px}}
  @keyframes glow{0%,100%{box-shadow:0 6px 0 var(--wood-dark),0 0 0 0 rgba(255,194,26,.9)}50%{box-shadow:0 6px 0 var(--wood-dark),0 0 0 12px rgba(255,194,26,.35)}}
  .target{font-size:min(11vw,64px);padding:.25em .45em;border:5px solid var(--wood);box-shadow:0 6px 0 var(--wood-dark)}
  #check{width:clamp(72px,20vmin,100px);height:clamp(72px,20vmin,100px);border-radius:50%;background:var(--go);color:#fff;
    box-shadow:0 6px 0 #2c7a3d;display:grid;place-items:center;flex:0 0 auto}
  #check svg{width:55%;height:55%}
  #check:active{transform:translateY(4px);box-shadow:0 2px 0 #2c7a3d}
  #check:disabled{opacity:.5}
  @media (min-aspect-ratio: 6/5){
    .choice.digi{width:min(36vw,280px);font-size:min(8.5vh,4.6vw,60px);padding:.22em 0}
    .choice.ana{width:min(25vh,34vw,220px)}
    .target{font-size:min(12vh,7vw,80px)}
  }

  /* the cuckoo house (SVG) */
  .bird{transform:scale(0);transform-box:fill-box;transform-origin:30% 100%}
  .shutter{transform-box:fill-box;transition:transform .25s}
  .shutter.l{transform-origin:0 50%} .shutter.r{transform-origin:100% 50%}
  .pop .shutter{transform:scaleX(.12)}
  .pop .bird{animation:birdPop 1.5s ease-out}
  .pop .beak-low{animation:beak .5s 2 .25s}
  .beak-low{transform-box:fill-box;transform-origin:0 0}
  @keyframes birdPop{0%{transform:scale(0)}14%{transform:scale(1.3) translate(4px,-6px)}22%{transform:scale(1.15)}
    45%{transform:scale(1.2) translate(0,-4px)}70%{transform:scale(1.15)}88%{transform:scale(1.1)}100%{transform:scale(0)}}
  @keyframes beak{0%,100%{transform:rotate(0)}50%{transform:rotate(28deg)}}
  .flash{animation:flash .45s ease-in-out 4}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.15}}

  /* ---------- end card ---------- */
  #end{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(42,33,64,.45);padding:16px}
  #end .card{background:var(--cream);border:6px solid var(--wood);border-radius:28px;box-shadow:0 8px 0 var(--wood-dark);
    padding:clamp(14px,3vh,26px) clamp(16px,4vw,32px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,16px);
    max-width:min(94vw,560px);max-height:94vh}
  #end .card svg.bigbird{width:clamp(90px,22vmin,170px);height:auto;animation:dance 1s ease-in-out infinite}
  @keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-8px)}}
  #end h2{margin:0;font-size:clamp(28px,7vmin,48px);color:var(--wood-dark)}
  #endStars{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(24px,6.5vmin,40px);line-height:1}
  #endStars span{color:var(--gold);text-shadow:0 2px 0 #c58e00;animation:dotPop .4s backwards}
  #endStars span.helped{color:#f2d98a;text-shadow:none}
  #end .row{display:flex;gap:16px}
  .big{width:clamp(64px,17vmin,88px);height:clamp(64px,17vmin,88px);border-radius:50%;display:grid;place-items:center;
    background:var(--gold);box-shadow:0 6px 0 #c58e00;color:var(--ink)}
  .big svg{width:55%;height:55%}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #c58e00}
  .big.go{background:var(--go);color:#fff;box-shadow:0 6px 0 #2c7a3d}
  .big.go:active{box-shadow:0 2px 0 #2c7a3d}
  #end .credit{font-family:var(--read);font-size:11px;color:#8d7b6a;margin:0}
</style>
</head>
<body>

<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<button id="mute" aria-label="Sound on or off" title="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/><g class="on" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15.5 9.5 5 5M20.5 9.5l-5 5"/></g></svg></button>

<section id="menu">
  <h1>Cuckoo Clock</h1>
  <svg class="art" id="menuArt" viewBox="0 0 320 400" aria-hidden="true"></svg>
  <div id="levels"></div>
</section>

<section id="play" hidden>
  <div id="bar"></div>
  <div id="stage">
    <svg id="house" viewBox="0 0 320 400" aria-label="Clock"></svg>
    <button id="again" aria-label="Say it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-9l-5 4v-4H4A1.5 1.5 0 0 1 2.5 15V6A1.5 1.5 0 0 1 4 4.5z" fill="#fff"/><g fill="none" stroke="#2a2140" stroke-width="2" stroke-linecap="round"><path d="M8 9v3M11 7.5v6M14 9v3M17 10v1"/></g></svg></button>
  </div>
  <div id="panel"></div>
</section>

<div id="end" hidden>
  <div class="card">
    <svg class="bigbird" viewBox="-40 -30 84 56" aria-hidden="true"></svg>
    <h2>You did it!</h2>
    <div id="endStars"></div>
    <div class="row">
      <button class="big" id="toMenu" aria-label="Pick a clock"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></g></svg></button>
      <button class="big" id="replay" aria-label="Play again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M20 3.5V9h-5.5z" fill="currentColor"/></svg></button>
      <button class="big go" id="nextLvl" aria-label="Next clock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5 17 12l-9 7.5z" fill="currentColor"/></svg></button>
    </div>
    <p class="credit">Voices and sounds: elevenlabs.io</p>
  </div>
</div>

<script>
/* ============================================================
   Tuning knobs
   ============================================================ */
const ROUND = 10;                 // questions in a round
const ROUND_TYPES = ['read', 'read', 'read', 'read', 'match', 'match', 'match', 'set', 'set', 'set'];
// read: the hand clock is shown, pick the digital time. match: a digital time is shown and said, pick the hand clock.
// set: a digital time is shown and said, turn the hands to it.
const LEVELS = [   // minutes each level asks about (repeats make a time come up more often)
  { mins: [0],                                                         eg: [3, 0] },    // o'clock
  { mins: [30, 30, 30, 0],                                             eg: [3, 30] },   // half past
  { mins: [15, 45, 15, 45, 30, 0],                                     eg: [3, 15] },   // quarter past / to
  { mins: [5, 10, 20, 25, 35, 40, 50, 55, 5, 10, 20, 25, 35, 40, 50, 55, 15, 45, 30], eg: [3, 25] },   // five minutes
];
const STEP = [60, 30, 15, 5];     // how far the minute hand clicks when dragged, per level
const NEXT_DELAY = 700;           // ms of quiet after the celebration before the next question
const TRIES_BEFORE_HELP = 2;      // wrong answers before the right one is shown

/* ============================================================
   Helpers
   ============================================================ */
const $ = (id) => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.append(n);
  return n;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('cuckoo.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cuckoo.' + k, JSON.stringify(v)); } catch {} },
};
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = (m) => String(m).padStart(2, '0');
const wrapH = (h) => ((h - 1) % 12 + 12) % 12 + 1;   // any integer → 1..12
const key = (t) => t.h + ':' + pad(t.m);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ============================================================
   Saying the time
   ============================================================ */
const HOUR_WORD = ['twelve', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const PART = { 5: ['five past', 'p-5-past'], 10: ['ten past', 'p-10-past'], 20: ['twenty past', 'p-20-past'], 25: ['twenty-five past', 'p-25-past'],
  35: ['twenty-five to', 'p-25-to'], 40: ['twenty to', 'p-20-to'], 50: ['ten to', 'p-10-to'], 55: ['five to', 'p-5-to'] };
function phrase(t) {
  const h = HOUR_WORD[t.h], next = HOUR_WORD[wrapH(t.h + 1)];
  if (t.m === 0) return h + " o'clock";
  if (t.m === 15) return 'quarter past ' + h;
  if (t.m === 30) return 'half past ' + h;
  if (t.m === 45) return 'quarter to ' + next;
  return PART[t.m][0] + ' ' + (t.m < 30 ? h : next);
}
// the clips that say a time: one whole phrase for o'clock, half and quarter times, else "twenty-five past" + "three"
function timeSay(t) {
  if (t.m % 15 === 0) return [[`t-${t.h}-${pad(t.m)}`, phrase(t)]];
  const h = t.m < 30 ? t.h : wrapH(t.h + 1);
  return [[PART[t.m][1], PART[t.m][0]], [`h-${h}`, HOUR_WORD[h]]];
}

/* ============================================================
   Sound: ElevenLabs clips from assets/, with synthesized sounds
   and the device voice as fallback (e.g. on file://)
   ============================================================ */
const ASSET_V = 1;            // bump after replacing any file in assets/
const CLIP_VOL = 0.8;         // sound effect clips
const VOICE_VOL = 1;          // spoken clips
const CLIP_TRIM = { 'sfx-cuckoo': 0.5, 'sfx-chime': 0.5 };   // per-clip level trims, measured so the effects sit near the voice's loudness
const VOICE_GAP = 0.12;       // seconds of pause after a question ("Which clock says…") before the time
const JOIN_GAP = 0.01;        // seconds between the minutes and the hour ("twenty-five past" … "three"), so they run on like one phrase
const SPEECH_FLOOR = 0.03;    // a 20 ms stretch quieter than this share of the clip's loudest counts as silence (keeps the soft "th" and "f")
const CLIPS = [
  ...Array.from({ length: 12 }, (_, i) => [0, 15, 30, 45].map((m) => `t-${i + 1}-${pad(m)}`)).flat(),
  ...Object.values(PART).map((p) => p[1]), ...Array.from({ length: 12 }, (_, i) => `h-${i + 1}`),
  'say-what-time', 'say-which-clock', 'say-show-me', 'say-yes-1', 'say-yes-2', 'say-yes-3', 'say-yes-4',
  'say-oops', 'say-hint-hour', 'say-hint-minute', 'say-done',
  'sfx-cuckoo', 'sfx-chime', 'sfx-ticktock',
];
const sfx = (() => {
  let ac = null, out = null, noiseBuf = null, voices = [], speakTimer = 0, muted = store.get('muted', false);
  const raw = {}, clips = {}, spans = {};   // fetched bytes start loading now; decoding needs the AudioContext from the first tap
  for (const n of CLIPS) raw[n] = fetch(`assets/${n}.mp3?v=${ASSET_V}`).then((r) => r.ok ? r.arrayBuffer() : null).catch(() => null);
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); out = ac.createGain(); out.gain.value = muted ? 0 : 0.8; out.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    for (const n of CLIPS) raw[n].then((b) => b && new Promise((res, rej) => ac.decodeAudioData(b, res, rej)))
      .then((buf) => { if (buf) { clips[n] = buf; spans[n] = speechSpan(buf); } }).catch(() => {});
  }
  // where the words start and stop in a clip, in seconds, so joined clips skip the silence and breaths around them
  function speechSpan(buf) {
    const d = buf.getChannelData(0), W = Math.round(buf.sampleRate * 0.02), env = [];
    for (let i = 0; i + W <= d.length; i += W) { let sum = 0; for (let j = i; j < i + W; j++) sum += d[j] * d[j]; env.push(Math.sqrt(sum / W)); }
    const floor = Math.max(...env) * SPEECH_FLOOR;
    const first = env.findIndex((v) => v >= floor), last = env.length - 1 - [...env].reverse().findIndex((v) => v >= floor);
    return { from: Math.max(0, first * 0.02 - 0.02), to: Math.min(buf.duration, (last + 1) * 0.02 + 0.02) };
  }
  // plays a loaded clip (or the part of it from `from` to `to` seconds, faded at the cuts) `at` seconds from now;
  // returns null if it isn't loaded so the caller can synthesize
  function clip(name, vol = CLIP_VOL, at = 0, from = 0, to = 0) {
    const buf = clips[name]; if (!ac || !buf) return null;
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf;
    const v = vol * (CLIP_TRIM[name] ?? 1), t = ac.currentTime + at;
    if (to) {

    (function frame() {
      if (my !== token) return done();
      const k = Math.min(1, (performance.now() - t0) / D), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      const v = from + (to - from) * e, s = ((v % 720) + 720) % 720;
      face.set(Math.floor(s / 60) || 12, s % 60);
      if (k < 1) setTimeout(frame, 16); else done();   // (not requestAnimationFrame: it pauses in a hidden tab, and the round would stall)
    })();
  });
  if (my !== token) return;
  setTot = to;
  results[qi] = 'helped'; drawBar();
  const dur = sfx.say(timeSay(q.t), 0.1);
  qi++;
  nextQuestion(Math.max(1800, dur * 1000) + NEXT_DELAY + 400);
}

/* ---------- end of round ---------- */
function endRound() {
  q = null; busy = true;
  const gold = results.filter((r) => r === 'gold').length;
  if (gold > store.get('best' + level, -1)) store.set('best' + level, gold);
  $('endStars').innerHTML = results.map((r, i) => `<span class="${r}" style="animation-delay:${i * 0.08}s">★</span>`).join('');
  $('nextLvl').hidden = level >= LEVELS.length - 1;
  $('end').hidden = false;
  sfx.fanfare(); sfx.cuckoo(0.9);
  sfx.say([['say-done', 'You did it! Cuckoo!']], 1.9);
  drawMenu();
}
$('replay').onclick = () => { sfx.tap(); startLevel(level); };
$('nextLvl').onclick = () => { sfx.tap(); startLevel(Math.min(level + 1, LEVELS.length - 1)); };
$('toMenu').onclick = () => { sfx.tap(); sfx.hush(); token++; show('menu'); };
$('again').onclick = () => { sfx.init(); if (!busy) prompt(); };
$('mute').onclick = () => { sfx.init(); $('mute').classList.toggle('muted', sfx.toggle()); };
$('mute').classList.toggle('muted', sfx.muted);

/* ---------- menu ---------- */
function drawMenu() {
  $('levels').innerHTML = '';
  LEVELS.forEach((L, i) => {
    const t = { h: L.eg[0], m: L.eg[1] }, best = store.get('best' + i, -1);
    const b = document.createElement('button');
    b.className = 'lvl'; b.setAttribute('aria-label', phrase(t));
    b.append(miniClock(t));
    const d = document.createElement('span'); d.className = 'digi'; d.innerHTML = digiHTML(t);
    const s = document.createElement('span'); s.className = 'stars'; s.textContent = best >= 0 ? '★ ' + best : '';
    b.append(d, s);
    b.onclick = () => { sfx.init(); sfx.tap(); startLevel(i); };
    $('levels').append(b);
  });
}
drawMenu();
</script>

    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
